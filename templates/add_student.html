<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <div class="container-box">

            <h1 class="heading">➕ Add Student</h1>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Student ID</label>

                    <input type="text" name="id" class="form-control" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Student Name</label>

                    <input type="text" name="name" class="form-control" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Python Mark</label>

                    <input type="number" name="python" class="form-control" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Java Mark</label>

                    <input type="number" name="java" class="form-control" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">DBMS Mark</label>

                    <input type="number" name="dbms" class="form-control" required>

                </div>

                <button type="submit" class="btn btn-success">
                    Add Student
                </button>

                <a href="/" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</body>

</html>
